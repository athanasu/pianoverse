[project]
name = "pianoverse-engine"
version = "0.1.0"
description = "Song to playable piano arrangement"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "pretty_midi>=0.2.10",
  "setuptools<81",
  "mir_eval>=0.7",
  "pydantic>=2.6",
  "torch>=2.2,<2.9",
  "torchaudio>=2.2,<2.9",
  "demucs==4.0.1",
  "basic-pitch>=0.4",
  "piano-transcription-inference>=0.0.6",
  "beat-this",
  "sqlalchemy>=2",
  "fastapi>=0.162.2",
  "python-multipart>=0.0.33",
]

[project.scripts]
pianoverse-engine = "pianoverse_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pianoverse_engine"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs ML models and real audio (minutes)"]

[tool.uv.sources]
beat-this = { url = "https://github.com/CPJKU/beat_this/archive/main.zip" }
